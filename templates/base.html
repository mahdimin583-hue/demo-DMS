
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FloodGuard PH{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark flood-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">FloodGuard PH</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavigation">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{{ url_for('user_dashboard') }}">Resident Portal</a>
                    <a class="nav-link" href="{{ url_for('admin_dashboard') }}">Admin Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="notice-banner mb-4">
            <strong>FloodGuard PH</strong>
            <span>Community flood monitoring and disaster preparedness</span>
        </div>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer py-3 mt-5">
        <div class="container text-center">
            <small>
                FloodGuard PH | CC105 Database Management Project
                <br>
                Educational demonstration — not an official emergency alert system.
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
